<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZacCode - Reposição de Estoque</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca de Leitura de Código de Barras / QR Code -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F172A; } /* bg-slate-950 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Tema App Android ZacCode */
        .app-bg { background-color: #161E2C; }
        .app-card { background-color: #252F40; }
        
        /* Animação Scanner */
        @keyframes scanAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(200px); }
        }
        .animate-scan { animation: scanAnim 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="text-slate-200 antialiased h-screen flex flex-col overflow-hidden">

    <!-- CABEÇALHO DO SITE -->
    <header class="bg-slate-900/90 backdrop-blur-md z-50 border-b border-slate-800 shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-white font-black text-xl tracking-tight">Zac<span class="text-blue-500">Code</span></span>
                <span class="text-xs font-bold bg-blue-500/20 text-blue-400 px-2 py-1 rounded-md ml-2 hidden sm:block">Sistemas e Tecnologia</span>
            </div>
            <div class="text-xs font-bold text-slate-400">
                MÓDULO DE ESTOQUE WEB
            </div>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL: SIMULADOR DO APP -->
    <main class="flex-1 overflow-y-auto flex justify-center items-start pt-6 pb-12 px-4 scrollbar-hide">
        
        <!-- MOCKUP DO CELULAR -->
        <div class="bg-black rounded-[2.5rem] w-full max-w-[400px] overflow-hidden border-[8px] border-slate-800 shadow-2xl relative ring-4 ring-slate-900/50">
            
            <!-- TELA DO APLICATIVO -->
            <div class="app-bg w-full h-full min-h-[800px] flex flex-col relative overflow-y-auto scrollbar-hide pb-20">
                
                <div class="p-4 flex-1 flex flex-col">
                    <h1 class="text-[#007BFF] text-lg font-bold text-center mb-4 tracking-wide">REPOSIÇÃO DE ESTOQUE</h1>

                    <!-- CÂMERA MOCKUP / LEITOR -->
                    <div class="w-full h-[220px] bg-black mb-4 relative rounded-lg overflow-hidden border border-slate-700">
                        <div id="reader" class="w-full h-full object-cover"></div>
                        
                        <!-- Overlay Visual do Scanner -->
                        <div id="scanner-laser" class="absolute inset-x-0 top-0 h-0.5 bg-blue-500 shadow-[0_0_15px_#3B82F6] animate-scan hidden z-20"></div>

                        <div id="cam-botoes" class="absolute top-2 right-2 flex gap-2 z-30">
                            <button onclick="alert('IA do Google simulada no Web.')" class="w-10 h-10 bg-[#252F40]/80 backdrop-blur rounded-full flex items-center justify-center text-[#4285F4] hover:bg-[#252F40]">
                                🧠
                            </button>
                            <button onclick="alert('Zaccode Lens simulado no Web.')" class="w-10 h-10 bg-[#252F40]/80 backdrop-blur rounded-full flex items-center justify-center text-[#A6E3A1] hover:bg-[#252F40]">
                                🔍
                            </button>
                            <button onclick="toggleCamera()" id="btn-cam" class="w-10 h-10 bg-[#252F40]/80 backdrop-blur rounded-full flex items-center justify-center text-[#F2D406] hover:bg-[#252F40]">
                                📷
                            </button>
                        </div>

                        <div id="cam-status" class="absolute inset-0 flex items-center justify-center text-xs text-slate-500 font-bold bg-black/50 z-10 pointer-events-none">
                            Câmera inativa. Clique no botão 📷.
                        </div>
                    </div>

                    <!-- IDENTIFICAÇÃO DO PRODUTO -->
                    <div class="app-card rounded-lg p-3 mb-3">
                        <label class="text-[#88FFFFFF] text-xs font-semibold mb-1 block">Identificação do Produto</label>
                        <input type="text" id="edtCodigo" readonly placeholder="Bipe o código..." class="w-full bg-transparent border-b border-slate-600 text-white placeholder-slate-500 py-2 text-base outline-none mb-2">
                        <input type="number" id="edtCodigoProduto" placeholder="Ou digite o código interno" class="w-full bg-transparent border-b border-slate-600 text-white placeholder-slate-500 py-2 text-sm outline-none">
                    </div>

                    <!-- GRIDS DE STATUS E LOCAL -->
                    <div class="app-card rounded-lg p-3 mb-3 flex gap-4">
                        <div class="flex-1">
                            <label class="text-[#88FFFFFF] text-[11px] font-bold block mb-2">📍 ONDE VOCÊ ESTÁ?</label>
                            <div class="space-y-2">
                                <label class="flex items-center gap-2 text-sm text-white cursor-pointer">
                                    <input type="radio" name="local" value="LOJA" checked class="accent-[#007BFF] w-4 h-4"> NA LOJA
                                </label>
                                <label class="flex items-center gap-2 text-sm text-white cursor-pointer">
                                    <input type="radio" name="local" value="ESTOQUE" class="accent-[#007BFF] w-4 h-4"> NO ESTOQUE
                                </label>
                            </div>
                        </div>
                        <div class="flex-1">
                            <label class="text-[#88FFFFFF] text-[11px] font-bold block mb-2">📊 STATUS DO ITEM</label>
                            <div class="space-y-2">
                                <label class="flex items-center gap-2 text-sm text-[#28A745] font-bold cursor-pointer">
                                    <input type="radio" name="status" value="OK" class="accent-[#28A745] w-4 h-4"> TEM (OK)
                                </label>
                                <label class="flex items-center gap-2 text-sm text-[#DC3545] font-bold cursor-pointer">
                                    <input type="radio" name="status" value="F" checked class="accent-[#DC3545] w-4 h-4"> FALTA (F)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- QUANTIDADE E TIPO -->
                    <div class="app-card rounded-lg p-3 mb-3 flex items-center justify-between">
                        <input type="text" id="edtQuantidade" value="1" placeholder="Qtd" class="w-1/3 bg-transparent text-[#A6E3A1] font-bold text-xl outline-none border-b border-slate-600 pb-1 text-center">
                        
                        <div class="flex gap-4">
                            <label class="flex items-center gap-2 text-sm text-white cursor-pointer">
                                <input type="radio" name="tipo" value="Un" checked class="accent-[#007BFF] w-4 h-4"> UN
                            </label>
                            <label class="flex items-center gap-2 text-sm text-white cursor-pointer">
                                <input type="radio" name="tipo" value="Cx" class="accent-[#007BFF] w-4 h-4"> CX
                            </label>
                        </div>
                    </div>

                    <!-- SWITCHES -->
                    <div class="flex gap-4 mb-4 px-1">
                        <label class="flex items-center gap-2 text-white text-sm cursor-pointer flex-1">
                            <input type="checkbox" id="swVoz" class="accent-[#007BFF] w-4 h-4"> Voz
                        </label>
                        <label class="flex items-center gap-2 text-white text-sm cursor-pointer flex-1">
                            <input type="checkbox" id="swAuto" class="accent-[#007BFF] w-4 h-4"> Auto
                        </label>
                    </div>

                    <!-- BOTÕES DE AÇÃO -->
                    <button onclick="processarEnvio()" class="w-full bg-[#007BFF] hover:bg-blue-600 text-white font-bold py-3.5 rounded-lg mb-4 transition-colors text-sm shadow-lg shadow-blue-500/20">
                        GRAVAR ITEM
                    </button>

                    <label class="text-[#88FFFFFF] text-xs font-semibold mb-2 block">ITENS CONTADOS</label>
                    
                    <!-- HISTÓRICO -->
                    <div id="containerHistorico" class="bg-white/5 rounded-lg p-2 min-h-[100px] flex flex-col gap-2 mb-4">
                        <!-- Itens gravados aparecerão aqui -->
                    </div>

                    <button onclick="analisarCruzamentosParaCD()" class="w-full bg-[#28A745] hover:bg-green-600 text-white font-bold py-3.5 rounded-lg mb-6 transition-colors text-sm shadow-lg shadow-green-500/20">
                        CRUZAR E ENVIAR LOTE
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL F+F (PEDIDO CD) -->
    <div id="modalCD" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">🚨 PEDIDO PARA O CD</h2>
            <p id="modalCDBody" class="text-slate-600 text-sm leading-relaxed">O produto faltou na LOJA e no ESTOQUE!<br><br>Qual a quantidade do pedido para o CD?</p>
            
            <input type="number" id="modalCDQtd" class="w-full bg-slate-100 border border-slate-300 text-slate-900 font-bold p-3 rounded-lg outline-none text-lg text-center">
            
            <div class="flex gap-4 justify-center py-2">
                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer font-bold">
                    <input type="radio" name="modalCDTipo" value="Un" class="accent-blue-600 w-4 h-4"> Unidade
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer font-bold">
                    <input type="radio" name="modalCDTipo" value="Cx" class="accent-blue-600 w-4 h-4"> Caixa
                </label>
            </div>
            
            <button onclick="salvarDecisaoCD()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700">
                SALVAR
            </button>
        </div>
    </div>

    <!-- AUDIO FILES SIMULADOS (Beep) -->
    <audio id="audioBeep" src="https://www.soundjay.com/buttons/sounds/beep-07a.mp3" preload="auto"></audio>

    <script>
        // === VARIÁVEIS GLOBAIS ===
        const inventario = new Map(); // Mapa para simular LinkedHashMap do Kotlin
        let html5QrCode = null;
        let scannerAtivo = false;
        
        // Voz
        let recognition = null;
        let isEsperandoVoz = false;

        // F+F Logic
        let filaFaltas = [];
        let indexFaltaAtual = 0;

        // === INICIALIZAÇÃO DE VOZ (Web Speech API) ===
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onresult = function(event) {
                const transcricao = event.results[0][0].transcript.toLowerCase();
                tratarVoz(transcricao);
            };

            recognition.onerror = function(event) {
                console.log("Erro no reconhecimento de voz:", event.error);
                isEsperandoVoz = false;
            };

            recognition.onend = function() {
                isEsperandoVoz = false;
            };
        }

        // === CONTROLE DA CÂMERA E SCANNER ===
        function toggleCamera() {
            if (scannerAtivo) {
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                        scannerAtivo = false;
                        document.getElementById('scanner-laser').classList.add('hidden');
                        document.getElementById('cam-status').style.display = 'flex';
                    });
                }
            } else {
                document.getElementById('cam-status').style.display = 'none';
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 100 } };
                
                html5QrCode.start({ facingMode: "environment" }, config, acaoAposBip)
                .then(() => {
                    scannerAtivo = true;
                    document.getElementById('scanner-laser').classList.remove('hidden');
                })
                .catch(err => {
                    alert("Erro ao iniciar câmera. Verifique as permissões.");
                    document.getElementById('cam-status').style.display = 'flex';
                });
            }
        }

        function acaoAposBip(decodedText, decodedResult) {
            // Toca beep
            document.getElementById('audioBeep').play().catch(e => {});
            
            // Simula vibrar
            if (navigator.vibrate) navigator.vibrate(150);

            const edtCodigo = document.getElementById('edtCodigo');
            edtCodigo.value = decodedText.trim();

            const swVoz = document.getElementById('swVoz').checked;
            const swAuto = document.getElementById('swAuto').checked;

            if (swVoz && recognition) {
                // Simula "tocarMinhaVoz(R.raw.voz_quantidade)"
                iniciarEscutaVoz();
            } else if (swAuto) {
                processarEnvio();
            }
            
            // Pausa scanner temporariamente
            if (html5QrCode) html5QrCode.pause();
            setTimeout(() => { if (html5QrCode && scannerAtivo) html5QrCode.resume(); }, 2000);
        }

        // === LÓGICA DE VOZ ===
        function iniciarEscutaVoz() {
            if (recognition && !isEsperandoVoz) {
                isEsperandoVoz = true;
                recognition.start();
                // Efeito visual no placeholder para mostrar que está escutando
                document.getElementById('edtQuantidade').placeholder = "Ouvindo...";
            }
        }

        function tratarVoz(texto) {
            document.getElementById('edtQuantidade').placeholder = "Qtd";
            
            if (texto.includes("cancela") || texto.includes("cancelar")) {
                document.getElementById('edtCodigo').value = "";
                document.getElementById('edtQuantidade').value = "1";
                return;
            }

            if (texto.includes("caixa") || texto.includes("caixas")) {
                document.querySelector('input[name="tipo"][value="Cx"]').checked = true;
            } else if (texto.includes("unidade") || texto.includes("embalagem")) {
                document.querySelector('input[name="tipo"][value="Un"]').checked = true;
            }

            // Extrair número (Regex equivalente ao Kotlin)
            const match = texto.match(/\d+/);
            let quantidade = match ? match[0] : null;

            if (!quantidade) {
                const numExt = {"um":"1", "uma":"1", "dois":"2", "duas":"2", "três":"3", "tres":"3", "quatro":"4", "cinco":"5", "seis":"6", "meia":"6", "sete":"7", "oito":"8", "nove":"9", "dez":"10"};
                for (let palavra of texto.split(" ")) {
                    if (numExt[palavra]) {
                        quantidade = numExt[palavra];
                        break;
                    }
                }
            }

            if (quantidade) {
                document.getElementById('edtQuantidade').value = quantidade;
                if (document.getElementById('swAuto').checked) {
                    processarEnvio();
                }
            }
        }

        // === PROCESSAR GRAVAÇÃO DE ITEM ===
        function processarEnvio() {
            const codInput = document.getElementById('edtCodigoProduto').value.trim();
            const codBip = document.getElementById('edtCodigo').value.trim();
            const cod = codInput !== "" ? codInput : codBip;

            if (cod === "") {
                alert("Bipe ou digite um código!");
                return;
            }

            const isLoja = document.querySelector('input[name="local"]:checked').value === "LOJA";
            const status = document.querySelector('input[name="status"]:checked').value;
            const tipo = document.querySelector('input[name="tipo"]:checked').value;
            
            let rawQtd = document.getElementById('edtQuantidade').value.trim();
            let qtd = 1;
            
            // Simulando o try/catch de matemática básica do app Kotlin
            try {
                if (rawQtd.includes("*")) { const p = rawQtd.split("*"); qtd = parseInt(p[0]) * parseInt(p[1]); }
                else if (rawQtd.includes("+")) { const p = rawQtd.split("+"); qtd = parseInt(p[0]) + parseInt(p[1]); }
                else if (rawQtd.includes("-")) { const p = rawQtd.split("-"); qtd = parseInt(p[0]) - parseInt(p[1]); }
                else { qtd = parseInt(rawQtd) || 1; }
            } catch (e) { qtd = 1; }

            // Classe/Objeto ProdutoContagem
            let prod = inventario.get(cod);
            if (!prod) {
                prod = { 
                    codigo: cod, 
                    lojaStatus: "-", lojaQtd: 0, lojaTipo: "Un",
                    estqStatus: "-", estqQtd: 0, estqTipo: "Un",
                    cdQtdFinal: 0, cdTipoFinal: "Un"
                };
            }

            if (isLoja) {
                prod.lojaStatus = status;
                prod.lojaQtd = qtd;
                prod.lojaTipo = tipo;
            } else {
                prod.estqStatus = status;
                prod.estqQtd = qtd;
                prod.estqTipo = tipo;
            }

            inventario.set(cod, prod);
            atualizarTela();
        }

        function atualizarTela() {
            const container = document.getElementById('containerHistorico');
            container.innerHTML = "";

            // Reverte para mostrar o mais recente primeiro
            const itens = Array.from(inventario.values()).reverse();

            itens.forEach(p => {
                const divRow = document.createElement('div');
                divRow.className = "flex items-center justify-between p-2 bg-[#252F40] rounded border border-slate-700";

                const textoLoja = p.lojaStatus !== "-" ? `🛒 L: ${p.lojaStatus} (${p.lojaQtd}${p.lojaTipo})` : "";
                const textoEstq = p.estqStatus !== "-" ? `📦 E: ${p.estqStatus} (${p.estqQtd}${p.estqTipo})` : "";

                divRow.innerHTML = `
                    <div class="flex-1">
                        <div class="text-white font-bold text-sm">${p.codigo}</div>
                        <div class="text-xs text-slate-400 mt-0.5 flex gap-3">
                            <span class="${p.lojaStatus === 'F' ? 'text-red-400' : 'text-green-400'}">${textoLoja}</span>
                            <span class="${p.estqStatus === 'F' ? 'text-red-400' : 'text-green-400'}">${textoEstq}</span>
                        </div>
                    </div>
                    <button onclick="apagarItem('${p.codigo}')" class="text-red-500 hover:text-red-400 p-2 text-xl">&times;</button>
                `;
                container.appendChild(divRow);
            });

            // Limpa os campos após gravar
            document.getElementById('edtCodigo').value = "";
            document.getElementById('edtCodigoProduto').value = "";
            document.getElementById('edtQuantidade').value = "1";
        }

        function apagarItem(codigo) {
            inventario.delete(codigo);
            atualizarTela();
        }

        // === CRUZAMENTO (F+F) PARA O CENTRO DE DISTRIBUIÇÃO ===
        function analisarCruzamentosParaCD() {
            if (inventario.size === 0) {
                alert("Nenhum item contado.");
                return;
            }

            // Filtra os que têm Loja=F e Estoque=F
            filaFaltas = Array.from(inventario.values()).filter(p => p.lojaStatus === "F" && p.estqStatus === "F");
            indexFaltaAtual = 0;

            if (filaFaltas.length > 0) {
                abrirModalFalta();
            } else {
                enviarLoteAoServidor();
            }
        }

        function abrirModalFalta() {
            if (indexFaltaAtual >= filaFaltas.length) {
                fecharModalFalta();
                enviarLoteAoServidor();
                return;
            }

            const prod = filaFaltas[indexFaltaAtual];
            document.getElementById('modalCDBody').innerHTML = `O produto <b>${prod.codigo}</b> faltou na LOJA e no ESTOQUE!<br><br>Qual a quantidade do pedido para o CD?`;
            
            // Sugere a maior quantidade
            document.getElementById('modalCDQtd').value = Math.max(prod.lojaQtd, prod.estqQtd);
            
            // Auto-seleciona Caixa se um deles for caixa
            if (prod.lojaTipo === "Cx" || prod.estqTipo === "Cx") {
                document.querySelector('input[name="modalCDTipo"][value="Cx"]').checked = true;
            } else {
                document.querySelector('input[name="modalCDTipo"][value="Un"]').checked = true;
            }

            document.getElementById('modalCD').classList.remove('hidden');
            document.getElementById('modalCD').classList.add('flex');
        }

        function salvarDecisaoCD() {
            const prod = filaFaltas[indexFaltaAtual];
            const qtdFinal = parseInt(document.getElementById('modalCDQtd').value) || 1;
            const tipoFinal = document.querySelector('input[name="modalCDTipo"]:checked').value;

            // Atualiza no mapa base
            const itemReal = inventario.get(prod.codigo);
            itemReal.cdQtdFinal = qtdFinal;
            itemReal.cdTipoFinal = tipoFinal;
            inventario.set(prod.codigo, itemReal);

            indexFaltaAtual++;
            abrirModalFalta(); // Chama recursivamente até acabar a fila
        }

        function fecharModalFalta() {
            document.getElementById('modalCD').classList.add('hidden');
            document.getElementById('modalCD').classList.remove('flex');
        }

        // === ENVIO AO SERVIDOR ===
        function enviarLoteAoServidor() {
            const payload = [];

            inventario.forEach((p, cod) => {
                const stLoja = p.lojaStatus;
                const stEstoque = p.estqStatus;

                if (stLoja === "F" && stEstoque === "F") {
                    payload.push(`PEDIDO_CD;${p.cdTipoFinal};${cod};${p.cdQtdFinal};${stLoja};${stEstoque}`);
                } else {
                    const qtdFinal = Math.max(p.lojaQtd, p.estqQtd);
                    const tipoFinal = (p.estqTipo === "Cx" || p.lojaTipo === "Cx") ? "Cx" : "Un";
                    payload.push(`REPOSICAO_LOJA;${tipoFinal};${cod};${qtdFinal};${stLoja};${stEstoque}`);
                }
            });

            const stringFinal = `LOTE_COMPLETO|WebUser|WebSecao|${payload.join('|')}`;
            
            // Simula o Socket do app Kotlin com um Console Log e Alert
            console.log("Enviando ao servidor Socket (Simulado):", stringFinal);
            alert("Lote enviado com sucesso ao servidor!\n\nPayload Gerado:\n" + stringFinal);
            
            // Limpa após enviar
            inventario.clear();
            atualizarTela();
        }
    </script>
</body>
</html>
